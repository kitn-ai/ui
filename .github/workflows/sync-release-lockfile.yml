name: Sync release lockfile

# Keeps release-please's release PR MERGEABLE.
#
# WHY THIS EXISTS, and it is two releases of evidence. release-please's `node-workspace` plugin
# rewrites the internal dependency ranges in the release PR -- pre-1.0 a caret cannot cross a minor,
# so `@kitn.ai/mcp`'s kit range and `@kitn.ai/cli`'s create-kai range both have to move every minor
# release -- and it does NOT regenerate `pnpm-lock.yaml`. The lockfile's importer entries keep the
# old specifiers, so on the release commit:
#
#   ERR_PNPM_OUTDATED_LOCKFILE  Cannot install with "frozen-lockfile" because pnpm-lock.yaml is
#   not up to date with <ROOT>/packages/mcp/package.json
#
# fails EVERY leg about 30s in, the required checks on the SHA being published are therefore
# terminally red, and the publish gate (correctly) refuses. Both the 0.33.0 and the 0.34.0 releases
# needed a hand-made lockfile-only commit plus a fresh dispatch to get out.
#
# So this regenerates the lockfile ON the release branch, where release-please puts it, and the
# PR arrives mergeable. `scripts/lint-lockfile-specifiers.mjs` (required CI, before the install
# step) is the other half: it names the failure in one line on any branch that is not the release
# branch.
#
# THE TRIGGER IS THE PART THAT WAS WRONG FIRST, and the failure is invisible. A `push` trigger on
# the release branch looks right and CAN NEVER FIRE: release-please pushes that branch with
# GITHUB_TOKEN, and GitHub starts no workflow run for an event caused by GITHUB_TOKEN -- the same
# mechanism that leaves the release PR's own checks in `action_required`. Measured: the branch was
# sitting stale with a bumped range while this job had never run once. So it hangs off the RELEASE
# WORKFLOW's completion instead: that workflow is triggered by a real push to main (a merged PR),
# so its completion is an event GitHub will deliver, and by then release-please has already updated
# the release PR.
#
# IT CANNOT LOOP. It commits only when the regenerated file actually differs, so the second run
# finds nothing to do and pushes nothing -- and a push made with GITHUB_TOKEN triggers no workflows
# at all. Both facts are load-bearing, and neither is left to chance: the early exit is the first
# thing the shell does after the regeneration.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The release branch, explicitly: a `workflow_run` event checks out the DEFAULT branch, and
      # this job is entirely about the other one. `continue-on-error` because a MISSING branch is a
      # normal state (between releases), and a red run for it would train everyone to ignore this
      # job -- the steps below are gated on the outcome instead.
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: release-please--branches--main

      - name: No release branch to sync
        if: steps.checkout.outcome != 'success'
        run: echo "no release-please branch right now, so there is nothing to sync (expected between releases)."

      - if: steps.checkout.outcome == 'success'
        uses: pnpm/action-setup@v4

      - if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No `--frozen-lockfile`: regenerating is the point.
      - if: steps.checkout.outcome == 'success'
        run: pnpm install --lockfile-only

      - name: Commit the regenerated lockfile, or report that there was nothing to do
        if: steps.checkout.outcome == 'success'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches every manifest: nothing to sync."
            exit 0
          fi
          echo "regenerating pnpm-lock.yaml for the bumped ranges:"
          git --no-pager diff --stat -- pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(release): regenerate the lockfile for the bumped internal ranges'
          git push
