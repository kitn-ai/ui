<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant</title>
    <link rel="stylesheet" href="./assistant.css" />
  </head>
  <body>
    <!-- The full-page assistant as a composition of the kit's own parts. The
         kai-workspace SHELL owns the layout - the start aside for the rail, the
         resize handle between the columns, the collapse breakpoint and the
         drawer below it - and the chat parts ride in its slots: a
         kai-conversations rail, and a top bar + kai-thread + kai-prompt-input
         column in main. The whole page IS the block, so data-block-root sits on
         the shell; there is no host stand-in to leave behind.

         THE SHELL IS UNCONTROLLED ON PURPOSE. `startCollapsed` is exactly what
         `collapse-below` will not fight (the shell skips a controlled aside),
         so the breakpoint keeps working and the block mirrors the shell's own
         kai-aside-toggle into State instead: the rail's controlled `collapsed`
         and the top bar's reopen button both read that one field, which is what
         keeps them from disagreeing with the shell.

         The wiring is DECLARED here and applied by the generated binder (spec
         3.1): .prop sets a JS property, :attr a runtime scalar attribute,
         @event an action on THIS element (kai-* events do not bubble), #ref
         names a handle the controller calls methods on, and *for repeats with
         a mandatory :key. A binding holds a field name, never an expression:
         every derivation, the rail's search filter included, is a field of
         State. The ids are for the block driver's state script, which is
         authored rather than generated.

         EVERY kai element here carries `:theme="themeMode"`, and it is the same
         field on all of them because the kit's scheme is PER ELEMENT: `theme`
         (light / dark / auto) is a prop on every kai element, its tokens live
         inside that element's own shadow root, and nothing about the scheme
         inherits. So the settings menu's choice has to be said on each element
         the page renders, or an element left at its `auto` default keeps
         following the OS while the rest of the page follows the reader.
         The three kai-kbd-group elements are the only kai elements WITHOUT it,
         and that is not an oversight: a group paints nothing of its own (it is a
         frame around its kai-kbd children, and each of those carries the
         binding), so there is no token inside it to flip. -->
    <kai-workspace
      id="workspace"
      class="app"
      data-block-root
      #ref="workspace"
      :theme="themeMode"
      :collapse-below="collapseBelow"
      :drawer-below="drawerBelow"
      @kai-aside-toggle="asideToggle"
    >
      <!-- The rail in ITEM mode (the documented consumer-owned loop): the rows
           are the block's own, so the built-in search box filters nothing by
           itself and the block does the filtering in State. Its built-in header
           toggle fires kai-toggle-sidebar, and collapseRail answers it with the
           SHELL's collapse: the column goes and main reflows, rather than the
           rail folding itself inside a column the page keeps.

           The footer slot holds the identity row. It is a PLACEHOLDER identity
           by rule ("Demo User", a demo plan): the kit owns no auth, no account
           and no settings screen, so the block shows one and says so in every
           item it cannot wire. -->
      <kai-conversations
        id="conversations"
        slot="start"
        :theme="themeMode"
        .collapsed="railCollapsed"
        .activeId="activeId"
        @kai-conversation-select="openConversation"
        @kai-new-chat="newChat"
        @kai-toggle-sidebar="collapseRail"
        @kai-search="search"
      >
        <kai-conversation-item
          *for="row of conversationRows"
          :key="row.id"
          :theme="themeMode"
          :conversation-id="row.id"
          :unread="row.unread"
        >
          <!-- The title, and - only while that row is the one being renamed -
               an inline field in its place. kai-editable-label is driven as a
               CONTROLLED editor (`.editing` follows State), which is what lets
               F2 and the row menu's Rename open it without the controller
               reaching into a row it cannot hold a ref to: `#ref` names one
               element, and a row inside a *for is many. The element autofocuses
               and selects its field when `editing` flips true. -->
          <span .textContent="row.title" :hidden="row.renaming"></span>
          <kai-editable-label
            class="row-rename"
            :hidden="row.renameFieldHidden"
            :theme="themeMode"
            .value="row.title"
            .editing="row.renaming"
            placeholder="Conversation name"
            @kai-rename="renameCommit"
            @kai-cancel="renameCancel"
          ></kai-editable-label>
          <span slot="meta" .textContent="row.preview" :hidden="row.previewHidden"></span>
          <!-- The row's trailing edge: its own menu, and nothing else. It sits
               in the item's `menu` region, which the item renders
               OUTSIDE its activation surface - that is what keeps a click on
               the kebab, or on the menu behind it, from also selecting the
               conversation.

               The menu reveals on hover or focus, in this block's stylesheet
               rather than in the kit: whether a row's menu is always visible is
               the row's presentation, and the kit's own default is to show it.

               kai-dropdown is the surface because the menu is authored markup:
               the kit's dropdown renders no items of its own, so a row can carry
               its own icon, a key chip and, when it cannot act, its reason in a
               tooltip. Its own doc sets the rule that makes the rows work: a
               slotted row carries role="menuitem" and tabindex="-1" to join the
               roving focus (and a row that cannot act carries aria-disabled,
               which takes it back out again). -->
          <kai-dropdown
            slot="menu"
            class="row-menu"
            :theme="themeMode"
            triggerIcon="more-horizontal"
            :label="row.menuLabel"
          >
            <!-- SHARE IS DISABLED AND SAYS WHY. It is the one affordance on this
                 page that needs something the block does not have (a share
                 endpoint you own), so it is inert with aria-disabled (out of the
                 roving focus, and announced as disabled) and its reason is a
                 tooltip rather than a label nobody can read. There is no handler
                 on it at all, which is what the row's behaviour comes from.

                 One kit behaviour to know about: the dropdown closes on any
                 pointer press inside its own surface (its outside-click test
                 compares the pressed node against the trigger and the menu in the
                 light DOM, and a press inside the surface is retargeted to the
                 host). A press on this row therefore closes the menu, and the row
                 itself still does nothing: there is no handler on it. -->
            <kai-tooltip
              :theme="themeMode"
              placement="left"
              content="Sharing needs a share endpoint you own. This block ships none, so the item is inert on purpose."
            >
              <span
                class="menu-row menu-row-disabled"
                role="menuitem"
                :tabIndex="menuItemTabIndex"
                aria-disabled="true"
              >
                <kai-icon :theme="themeMode" name="share"></kai-icon>
                <span class="menu-row-label">Share</span>
              </span>
            </kai-tooltip>

            <!-- THE MENU READS IN THREE GROUPS: what needs something you own
                 (Share), what this block really does (Rename, Pin, Archive), and
                 what it cannot undo (Delete). The divider is the kit's own
                 treatment - `role="separator"` on a presentational row (see
                 DropdownSeparator in components/dropdown/dropdown.tsx) - spelled
                 here because this page authors its menu markup.

                 HOW IT STAYS OUT OF THE KEYBOARD'S WAY: the divider is a plain
                 span with NO tabindex, so it is not focusable, and the dropdown's
                 roving focus walks `role="menuitem"` / `menuitemcheckbox` /
                 `menuitemradio` only - `role="separator"` matches none of them, so
                 ArrowUp and ArrowDown step straight over it, exactly as the kit's
                 own separator behaves. It is also not a kai- element: there is
                 nothing in it that could take a key. -->
            <span class="menu-separator" role="separator"></span>

            <!-- Each hint is one shortcut, so each is ONE kai-kbd inside a
                 kai-kbd-group. The token spec already splits the shortcut into a
                 cap per key (Mod+Shift+P is three caps in one element), and the
                 group is what welds them into a single key strip: it marks its
                 direct kai-kbd children `data-kai-join`, which zeroes the chord
                 gap between those caps and squares the corners they share. See
                 assistant.css for what the two renderings measure. -->

            <!-- The four items that ACT, in the order the menu reads, and the
                 shape of all four is the same three facts.

                 `data-op` is a LITERAL: the op is fixed per row, so the same
                 string in every cloned copy of this row is the correct value.
                 `:data-conversation-id` is BOUND, because inside a `*for` a
                 binding is the only per-row channel the page grammar has (a
                 literal attribute is cloned identically into every row). And
                 `@kai-click` names ONE action for all four: the binding hands it
                 the event, the event does not bubble, so `event.currentTarget`
                 is exactly the item that was clicked and the action reads the op
                 and the row off it. That is the whole reason an item carries
                 both.

                 The key chips show exactly the keys the block registers, and
                 they use kai-kbd's own token syntax: Mod is Cmd on a Mac and
                 Ctrl elsewhere, which is what the handler accepts too. Delete
                 has no chip because no key is bound for it. Each item is hidden
                 (not disabled) when its store lacks the operation, so a button
                 that cannot do anything is never offered. -->
            <kai-button
              role="menuitem"
              :tabIndex="menuItemTabIndex"
              :hidden="row.renameItemHidden"
              :theme="themeMode"
              data-op="rename"
              :data-conversation-id="row.id"
              variant="ghost"
              size="sm"
              full
              align="start"
              icon="pencil"
              @kai-click="rowMenuAction"
            >
              Rename
              <kai-kbd-group class="menu-kbd"><kai-kbd :theme="themeMode" keys="F2" size="sm"></kai-kbd></kai-kbd-group>
            </kai-button>
            <kai-button
              role="menuitem"
              :tabIndex="menuItemTabIndex"
              :hidden="row.pinItemHidden"
              :theme="themeMode"
              data-op="pin"
              :data-conversation-id="row.id"
              variant="ghost"
              size="sm"
              full
              align="start"
              icon="bookmark"
              @kai-click="rowMenuAction"
            >
              <span .textContent="row.pinLabel"></span>
              <kai-kbd-group class="menu-kbd"><kai-kbd :theme="themeMode" keys="Mod+Shift+P" size="sm"></kai-kbd></kai-kbd-group>
            </kai-button>
            <kai-button
              role="menuitem"
              :tabIndex="menuItemTabIndex"
              :hidden="row.archiveItemHidden"
              :theme="themeMode"
              data-op="archive"
              :data-conversation-id="row.id"
              variant="ghost"
              size="sm"
              full
              align="start"
              icon="archive"
              @kai-click="rowMenuAction"
            >
              Archive
              <kai-kbd-group class="menu-kbd"><kai-kbd :theme="themeMode" keys="Mod+Shift+A" size="sm"></kai-kbd></kai-kbd-group>
            </kai-button>

            <span class="menu-separator" role="separator"></span>

            <kai-button
              role="menuitem"
              :tabIndex="menuItemTabIndex"
              :hidden="row.deleteItemHidden"
              :theme="themeMode"
              data-op="delete"
              :data-conversation-id="row.id"
              class="menu-delete"
              variant="ghost"
              size="sm"
              full
              align="start"
              icon="trash"
              @kai-click="rowMenuAction"
            >
              Delete
            </kai-button>
          </kai-dropdown>
        </kai-conversation-item>

        <!-- The foot of the rail: a ROW of two menus, the identity trigger and the
             settings gear beside it (the shape of the kit's own perplexity lab).
             The identity row is a PLACEHOLDER by rule ("Demo User", a demo plan):
             the kit owns no auth, no account and no settings screen, so the block
             shows one and says so in every item it cannot wire.

             BOTH ARE kai-menu WITH AN ITEMS ARRAY, not authored rows. The trigger
             is SLOTTED content (an avatar, a name, a caret) and it is VISUAL ONLY:
             kai-menu supplies the button, aria-haspopup, aria-expanded and the
             roving focus, so the trigger slot carries no control of its own. The
             items are a prop, which is what the delivery forms carry best - and
             the settings menu's theme group is where that pays off, because a
             single-choice group is an item FIELD (`radioGroup` + `checked`)
             rather than three hand-authored rows with three bound attributes.

             The identity menu keeps `full`, which is what makes its trigger button
             fill the width of the ROW: `full` stretches the trigger to the box it
             is given, and what gives it the box is the flex row below. So the
             dropdown no longer owns the slot - the row decides who gets how much
             of it, with the identity side flexible and the gear fixed. -->
        <div slot="footer" class="rail-footer">
          <kai-menu
            class="profile"
            :theme="themeMode"
            .items="accountItems"
            full
            label="Account menu, Demo User"
            @kai-select="accountMenuSelect"
          >
            <span slot="trigger" class="profile-trigger">
              <kai-avatar :theme="themeMode" fallback="DU" size="sm" alt="Demo User"></kai-avatar>
              <span class="profile-name">Demo User</span>
              <kai-icon :theme="themeMode" name="chevron-up" class="profile-caret"></kai-icon>
            </span>
          </kai-menu>

          <!-- THE GEAR, and it is a real settings menu rather than a dead button:
               its theme group flips the WHOLE page (see the html header for why
               every kai element carries `:theme`). An icon-only TRIGGER, built
               from the element's own props: `triggerIcon` paints the glyph and
               `label` supplies the accessible name, because an icon is not text
               (the same rule the rail's built-in header buttons follow), and the
               kit then renders the button, not the block. -->
          <kai-menu
            class="settings"
            :theme="themeMode"
            .items="settingsItems"
            triggerIcon="settings"
            label="Settings"
            @kai-select="settingsMenuSelect"
          ></kai-menu>
        </div>
      </kai-conversations>

      <main slot="main" class="main">
        <header class="topbar">
          <div class="topbar-start">
            <!-- A collapsed aside is not painted at all (the shell's own call),
                 so the way back is the page's, not the rail's. -->
            <kai-button
              id="rail-reopen"
              variant="ghost"
              size="icon-sm"
              icon="panel-left"
              label="Open sidebar"
              :theme="themeMode"
              hidden
              :hidden="railReopenHidden"
              @kai-click="expandRail"
            ></kai-button>
            <h1>Assistant</h1>
          </div>
          <!-- The model switcher recipe: a standalone leaf element with no
               navigation anywhere near it. Models in as a JS property,
               selection out via kai-model-change. -->
          <kai-model-switcher
            id="models"
            :theme="themeMode"
            .models="models"
            .currentModel="currentModel"
            @kai-model-change="modelChange"
          ></kai-model-switcher>
        </header>

        <!-- The message list's two display choices are FIELDS rather than the
             literal this block used to carry, because the composer's + menu can
             now change both: a binding holds a field name and never an
             expression, so each needs a field of its own. The tighter rhythm
             (8px between turns instead of the default's spacing) is what a
             full-page assistant reads like, which is why the block starts on
             `compact`. -->
        <kai-thread id="thread" :theme="themeMode" :density="density" .codeHighlight="codeHighlight" .messages="messages" .loading="loading">
          <kai-empty
            slot="empty"
            :theme="themeMode"
            empty-title="What can I help with?"
            description="Open a guide, or start from a suggestion below."
          >
            <!-- THE GUIDE CARDS. Four entry points for the developer reading
                 this block, in the order they meet them: get it running, point
                 it at a model, add voice, send a card. A card is a kai-button
                 because a click binding lives on a kai element; the kit's own
                 Card would be a component written for one screen's worth of
                 content. Its accessible NAME is its own text - the title and
                 the summary together - so a screen reader hears what the card
                 says instead of a second label able to disagree with it. -->
            <div class="guide-cards">
              <kai-button
                *for="guide of guides"
                :key="guide.id"
                :theme="themeMode"
                variant="outline"
                align="start"
                full
                :data-guide="guide.id"
                @kai-click="openGuide"
              >
                <span class="guide-card-text">
                  <span class="guide-card-title" .textContent="guide.title"></span>
                  <span class="guide-card-summary" .textContent="guide.summary"></span>
                </span>
              </kai-button>
            </div>
          </kai-empty>
        </kai-thread>
        <!-- VOICE, and the shape of it. The mic in the composer's TRAILING
             cluster, beside Send, is the affordance (the kit paints it; a block
             cannot reach inside that toolbar), and it fires kai-voice with NO
             detail, so this block keeps the one bit that decides what a click
             means: start, or stop. kai-voice-input is the element that owns the recording, and it
             rides here as an unnamed child, which the kit's own docs describe as
             an invisible data carrier - the composer reads its named regions and
             projects nothing else. The transcript lands in the composer's
             `value`, the only channel a block has for writing into it.

             The strip above the textarea is where the block says what the kit's
             mic cannot: that it is listening, that recognition failed, or that
             the browser captured audio and has no speech recognition to turn it
             into words (the kit's documented record-only fallback). -->
        <!-- `.tools` is the composer's `+` menu, and `@kai-select` is every row
             in it: the kit renders the rows and this block decides what they do,
             so one handler reads the id and acts on it. -->
        <kai-prompt-input
          id="prompt"
          #ref="prompt"
          voice
          :theme="themeMode"
          .placeholder="promptPlaceholder"
          .suggestions="suggestions"
          .loading="loading"
          .triggers="triggers"
          .tools="tools"
          .value="promptValue"
          @kai-submit="submit"
          @kai-select="toolSelect"
          @kai-value-change="valueChange"
          @kai-voice="voiceToggle"
        >
          <span slot="input-top" class="voice-strip" :hidden="voiceStatusHidden" .textContent="voiceStatus"></span>
          <kai-voice-input
            id="voice"
            #ref="voice"
            :theme="themeMode"
            @kai-recording-change="voiceRecording"
            @kai-transcription="voiceTranscript"
            @kai-voice-error="voiceError"
            @kai-audio-captured="voiceCaptured"
          ></kai-voice-input>
        </kai-prompt-input>
      </main>
    </kai-workspace>
  </body>
</html>
