<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artifact toolbar</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* The viewer needs a height: the element fills its box and has none of its own. */
      kai-artifact { display: block; height: 28rem; }
      /* slot="toolbar" content is light DOM, so the page styles it. */
      .bar {
        display: flex; align-items: center; gap: 0.25rem; padding: 0.375rem 0.5rem;
        border-bottom: 1px solid var(--kai-color-border, #e5e5e5);
        background: var(--kai-color-surface, #fafafa);
      }
      .bar input {
        flex: 1; min-width: 0; height: 1.75rem; box-sizing: border-box; padding: 0 0.625rem;
        border: 1px solid var(--kai-color-border, #e5e5e5); border-radius: 0.375rem;
        font: 12px ui-monospace, monospace; background: transparent; color: inherit;
      }
      nav { display: flex; gap: 0.5rem; padding: 0.5rem; }
    </style>
  </head>
  <body>
    <kai-artifact id="viewer" src="https://example.com/" iframe-title="Preview">
      <div slot="toolbar" class="bar">
        <!-- Back and forward start disabled: nothing is behind or ahead until the
             first navigation, and the script re-enables them from the host's state. -->
        <kai-button id="back" variant="ghost" size="icon-sm" icon="arrow-left" label="Back" disabled></kai-button>
        <kai-button id="forward" variant="ghost" size="icon-sm" icon="arrow-right" label="Forward" disabled></kai-button>
        <kai-button id="reload" variant="ghost" size="icon-sm" icon="rotate-cw" label="Reload"></kai-button>
        <!-- A native input: its aria-label names the control itself, which a label on a
             kai-input host would not. -->
        <input id="address" readonly aria-label="Address" />
        <kai-button id="open" variant="ghost" size="icon-sm" icon="external-link" label="Open in new tab" disabled></kai-button>
      </div>
    </kai-artifact>

    <!-- Stand-ins for whatever drives navigation in your app. -->
    <nav>
      <kai-button id="page-one" variant="outline" size="sm">example.com</kai-button>
      <kai-button id="page-two" variant="outline" size="sm">example.org</kai-button>
    </nav>

    <script type="module" src="./artifact-toolbar.js"></script>
  </body>
</html>
